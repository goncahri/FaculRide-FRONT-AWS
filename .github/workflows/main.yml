name: CI / CD - Frontend - Production

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Semantic Release Production
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        with:
          extra_plugins: |
            @semantic-release/commit-analyzer
            @semantic-release/release-notes-generator
            @semantic-release/github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Login Docker Hub
        if: steps.semantic.outputs.new_release_published == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker
        if: steps.semantic.outputs.new_release_published == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            goncahri/faculride-frontend:production-v${{ steps.semantic.outputs.new_release_version }}
            goncahri/faculride-frontend:production-latest

      - name: Deploy to EC2
        if: steps.semantic.outputs.new_release_published == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            mkdir -p ${{ secrets.EC2_PATH }}
            cd ${{ secrets.EC2_PATH }}

            docker pull goncahri/faculride-frontend:production-latest

            docker stop faculride-frontend || true
            docker rm faculride-frontend || true

            docker run -d \
              --name faculride-frontend \
              --restart always \
              -p 8080:80 \
              goncahri/faculride-frontend:production-latest

  notify_failure:
    name: Notify Failure
    needs: pipeline
    runs-on: ubuntu-latest
    if: failure()

    steps:
      - name: Send error email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_HOST }}
          server_port: ${{ secrets.MAIL_PORT }}
          username: ${{ secrets.MAIL_USER }}
          password: ${{ secrets.MAIL_PASS }}
          subject: "🚨 FALHA NO CI/CD: ${{ github.repository }}"
          to: "${{ secrets.TEAM_EMAILS }}"
          from: "GitHub Actions <no-reply@faculride.com>"
          body: |
            O pipeline de produção do Frontend ${{ github.repository }} falhou.

            Detalhes:
            - Branch: ${{ github.ref_name }}
            - Autor do commit: ${{ github.actor }}
            - Workflow: ${{ github.workflow }}
            - Log do erro: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Verifique o link acima para entender a causa da falha.