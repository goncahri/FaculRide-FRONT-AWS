name: CI / CD - Frontend - Production

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Calcular nova versão
        id: version
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force --prune

          LAST_TAG=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -v 'preview' | head -n1 || true)
          [ -z "$LAST_TAG" ] && LAST_TAG="v0.0.0"
          echo "Última tag de produção: $LAST_TAG"

          CURRENT_VERSION="${LAST_TAG#v}"
          BASE_VERSION=$(echo $CURRENT_VERSION | cut -d'-' -f1)

          BUMP_TYPE=$(node -e "
            const { execSync } = require('child_process');
            try {
              const range = '${LAST_TAG}' === 'v0.0.0' ? 'HEAD' : '${LAST_TAG}..HEAD';
              const log = execSync('git log ' + range + ' --oneline', { encoding: 'utf8' });
              if (/feat!|fix!|BREAKING CHANGE/i.test(log)) console.log('major');
              else if (/feat/i.test(log)) console.log('minor');
              else if (/fix/i.test(log)) console.log('patch');
              else console.log('none');
            } catch {
              console.log('none');
            }
          ")

          if [ "$BUMP_TYPE" = "none" ]; then
            echo "Nenhuma alteração que exija bump de versão."
            echo "new_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
            echo "should_deploy=false" >> $GITHUB_OUTPUT
          else
            NEW_VERSION=$(npx semver -i $BUMP_TYPE "$BASE_VERSION")
            echo "Versão final: $CURRENT_VERSION -> $NEW_VERSION"
            echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
            echo "should_deploy=true" >> $GITHUB_OUTPUT
          fi

      - name: Atualizar package.json
        if: steps.version.outputs.should_deploy == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          npm version ${{ steps.version.outputs.new_version }} --git-tag-version=false

          git add package.json package-lock.json
          git commit -m "chore(release): bump version to v${{ steps.version.outputs.new_version }} [skip ci]"
          git push origin HEAD:${{ github.ref_name }}

      - name: Criar Release e Tag (GitHub)
        if: steps.version.outputs.should_deploy == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.new_version }}
          name: "Release v${{ steps.version.outputs.new_version }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Login Docker Hub
        if: steps.version.outputs.should_deploy == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Docker Buildx
        if: steps.version.outputs.should_deploy == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker
        if: steps.version.outputs.should_deploy == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            goncahri/faculride-frontend:production-v${{ steps.version.outputs.new_version }}
            goncahri/faculride-frontend:production-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  notify_failure:
    name: Notify Failure
    needs: pipeline
    runs-on: ubuntu-latest
    if: failure()

    steps:
      - name: Send error email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_HOST }}
          server_port: ${{ secrets.MAIL_PORT }}
          username: ${{ secrets.MAIL_USER }}
          password: ${{ secrets.MAIL_PASS }}
          subject: "🚨 FALHA NO CI/CD: ${{ github.repository }}"
          to: "${{ secrets.TEAM_EMAILS }}"
          from: "GitHub Actions <no-reply@faculride.com>"
          body: |
            O pipeline de produção do Frontend ${{ github.repository }} falhou.

            Detalhes:
            - Branch: ${{ github.ref_name }}
            - Autor do commit: ${{ github.actor }}
            - Workflow: ${{ github.workflow }}
            - Log do erro: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Verifique o link acima para entender a causa da falha.
