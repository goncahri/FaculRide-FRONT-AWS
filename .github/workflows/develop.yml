name: CI / CD - Frontend - Develop

on:
  push:
    branches:
      - develop

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Instalar Dependências
        run: npm ci

      - name: Calcular versão de preview
        id: version
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force --prune

          # Busca a última tag de produção para usar como base
          LAST_PROD_TAG=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -v 'preview' | head -n1 || true)
          [ -z "$LAST_PROD_TAG" ] && LAST_PROD_TAG="v0.0.0"

          BASE_VERSION="${LAST_PROD_TAG#v}"

          # Determina o tipo de bump com base nos commits
          BUMP_TYPE=$(node -e "
            const { execSync } = require('child_process');
            try {
              const range = '${LAST_PROD_TAG}' === 'v0.0.0' ? 'HEAD' : '${LAST_PROD_TAG}..HEAD';
              const log = execSync('git log ' + range + ' --oneline', { encoding: 'utf8' });
              if (/feat!|fix!|BREAKING CHANGE/i.test(log)) console.log('major');
              else if (/feat/i.test(log)) console.log('minor');
              else if (/fix/i.test(log)) console.log('patch');
              else console.log('patch');
            } catch {
              console.log('patch');
            }
          ")

          NEXT_BASE=$(npx semver -i $BUMP_TYPE "$BASE_VERSION")
          SHORT_SHA=$(git rev-parse --short HEAD)
          PREVIEW_VERSION="${NEXT_BASE}-preview.${SHORT_SHA}"

          echo "Versão de Preview gerada: $PREVIEW_VERSION"
          echo "new_version=$PREVIEW_VERSION" >> $GITHUB_OUTPUT

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            goncahri/faculride-frontend:development-v${{ steps.version.outputs.new_version }}
            goncahri/faculride-frontend:development-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
