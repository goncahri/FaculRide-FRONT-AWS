<section
  *ngIf="isOpen"
  class="chatbot-panel"
  id="faculride-chatbot"
  role="dialog"
  aria-label="Assistente do FaculRide"
>
  <header class="chatbot-header">
    <div class="chatbot-brand">
      <span class="chatbot-avatar" aria-hidden="true">FR</span>
      <div>
        <strong>Assistente FaculRide</strong>
        <span>Ajuda rápida</span>
      </div>
    </div>

    <button type="button" class="chatbot-icon-button" (click)="closeChat()" aria-label="Fechar assistente">
      <span aria-hidden="true">×</span>
    </button>
  </header>

  <div class="chatbot-content" aria-live="polite">
    <div class="chatbot-message">
      <strong>{{ currentNode.title }}</strong>
      <p>{{ currentNode.message }}</p>
    </div>

    <div *ngIf="currentNode.options?.length" class="chatbot-options" aria-label="Opções de resposta">
      <button
        *ngFor="let option of currentNode.options"
        type="button"
        class="chatbot-option"
        (click)="selectOption(option.target)"
      >
        <span>{{ option.label }}</span>
        <span aria-hidden="true">›</span>
      </button>
    </div>
  </div>

  <footer class="chatbot-footer">
    <button *ngIf="canGoBack" type="button" class="chatbot-text-button" (click)="goBack()">
      ← Voltar
    </button>
    <button type="button" class="chatbot-text-button restart" (click)="restart()">
      Recomeçar
    </button>
  </footer>
</section>

<button
  type="button"
  class="chatbot-launcher"
  (click)="toggleChat()"
  [attr.aria-expanded]="isOpen"
  aria-controls="faculride-chatbot"
  [attr.aria-label]="isOpen ? 'Fechar assistente do FaculRide' : 'Abrir assistente do FaculRide'"
>
  <svg *ngIf="!isOpen" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M4 4h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-5 4v-4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Zm3 5h10V7H7v2Zm0 4h7v-2H7v2Z" />
  </svg>
  <span *ngIf="isOpen" aria-hidden="true">×</span>
</button>
