<section class="register-section">
  <h2>Redefinir Senha</h2>
  <p class="subtexto">

  </p>
  <form [formGroup]="RecuperarSenhaForm" (ngSubmit)="recuperarSenha()">
    <div class="form-group">
      <label for="senha">Senha</label>
      <input
        type="password"
        id="senha"
        formControlName="senha"
        placeholder="Digite sua nova senha"
      />
      <div *ngIf="RecuperarSenhaForm.get('senha')?.invalid && RecuperarSenhaForm.get('senha')?.touched" class="erro">
        Por favor, insira uma senha forte com no mínimo de 8 caracteres, com letra maiúscula, minúscula, número e caractere especial.
      </div>
    </div>
    <div class="form-group">
      <label for="confirmarSenha">Confirmar Senha</label>
      <input
        type="password"
        id="confirmarSenha"
        formControlName="confirmarSenha"
        placeholder="Digite novamente sua nova senha"
      />

      <div *ngIf="RecuperarSenhaForm.get('confirmarSenha')?.value !== RecuperarSenhaForm.get('senha')?.value && RecuperarSenhaForm.get('confirmarSenha')?.dirty" class="erro">
        As senhas não coincidem.
      </div>
    </div>

    <button type="submit" class="btn-primary" [disabled]="RecuperarSenhaForm.invalid || RecuperarSenhaForm.get('confirmarSenha')?.value !== RecuperarSenhaForm.get('senha')?.value ">
      Salvar
    </button>
  </form>
</section>
